version: '3.8'

services:
  # 1. MongoDB Database Container
  mongodb:
    image: mongo:6.0
    container_name: agricare_mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: agricare_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Automated FastAPI AI & API Backend Container
  backend:
    build:
      context: ./backend_fastapi
      dockerfile: Dockerfile
    container_name: agricare_backend
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=agricare_db
    ports:
      - "8000:8000"

  # 3. Automated Web Webserver & Reverse Proxy (Nginx + Frontend Build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agricare_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data: